# .github/workflows/terraform_pipeline.yml
name: Terraform Deployment and Performance Test

on:
#  push:
#    branches:
#      - master
#    paths:
#      - 'terraform/**' # Этот пайплайн запускается только при изменениях в папке 'terraform/'
  workflow_dispatch: # Позволяет запускать пайплайн вручную из UI GitHub

jobs:
  deploy_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --- Шаг 1: Развертывание инфраструктуры ---
      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: ./terraform/environments/dev
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

      - name: Terraform Apply
        id: apply
        run: terraform apply --auto-approve
        working-directory: ./terraform/environments/dev
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

      # --- Шаг 2: Запуск и мониторинг теста ---
      - name: Run k6 Job
        id: k6_run
        # Используем kubectl для мониторинга Job, созданного Terraform
        run: |
          kubectl wait --for=condition=complete job/k6-test-job --timeout=10m -n k6-tests
          kubectl logs job/k6-test-job -n k6-tests

      # --- Шаг 3: Уничтожение ресурсов ---
      - name: Terraform Destroy
        if: always() # Этот шаг выполнится всегда, независимо от результата предыдущих
        id: destroy
        run: terraform destroy --auto-approve
        working-directory: ./terraform/environments/dev
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}