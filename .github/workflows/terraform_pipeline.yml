# .github/workflows/terraform_pipeline.yml
name: Terraform Deployment and Performance Test

on:
#  push:
#    branches:
#      - master
#    paths:
#      - 'terraform/**' # Этот пайплайн запускается только при изменениях в папке 'terraform/'
  workflow_dispatch: # Позволяет запускать пайплайн вручную из UI GitHub

jobs:
  deploy_infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/environments/dev
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

      - name: Terraform Apply
        run: terraform apply --auto-approve
        working-directory: ./terraform/environments/dev
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}

  run_performance_test:
    needs: deploy_infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Здесь будут шаги для запуска нагрузочного теста k6
      # После выполнения тестов, вы можете добавить шаг
      # для получения отчетов и их загрузки.

      - name: Terraform Destroy
        if: always() # Уничтожаем ресурсы, даже если предыдущий шаг провалился
        run: terraform destroy --auto-approve
        working-directory: ./terraform/modules/k6-job
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}