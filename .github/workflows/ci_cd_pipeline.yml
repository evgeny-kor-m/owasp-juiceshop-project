# .github/workflows/ci_cd_pipeline.yml
name: Testing

on:

#  Trigger the workflow on 'push' to specified branches.
  push:
    branches:
      - master # The workflow will run when changes are pushed to the 'master' branch.
    # Trigger the workflow when a 'pull request' (PR) is created or updated
    # for the specified branches.
  pull_request:
    branches:
      - master # The workflow will run for PRs targeting the 'master' branch.
  # Trigger the workflow on a schedule (cron job).
  schedule:
    # '0 2 * * *' means "every day at 2:00 UTC".
    - cron: '0 2 * * *'

  # Add the ability to manually trigger the workflow from the GitHub interface.
  workflow_dispatch:

# --- Jobs ---
#  Jobs are sets of steps that execute on a single runner (virtual machine).
#  Jobs run in parallel by default, unless dependencies are specified (needs).
jobs:

#--- The 'test' job (Run tests) ---
  test:
    runs-on: ubuntu-latest # Run on an Ubuntu virtual machine.
    timeout-minutes: 20 # Increase the timeout for the entire job to 20 minutes.
    # ADDED: Explicitly provide read permission for the repository contents
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - name: Checkout repository # Step to clone the code from the repository.
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          echo "${{ secrets.DOCKER_ENV_VARS }}" > .env
        env:
          DOCKER_ENV_VARS: ${{ secrets.DOCKER_ENV_VARS }}

      - name: Run tests with Docker Compose
        run: |
          # Use your Makefile target to run the tests
          make test

      - name: Upload Allure Results # Upload Allure results as artifacts.
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results # Path is now correct relative to the root

      - name: Upload Allure HTML Report # Upload the generated Allure HTML report as an artifact.
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-reports # Path to the generated Allure HTML report

      - name: Upload Pytest HTML Report # Upload the Pytest HTML report as artifacts.
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: html-reports/report.html # Path is now correct relative to the root

      - name: Upload Pytest Logs # Upload the Pytest Logs as artifacts.
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-report
          path: logs/test_run.log # Path is now correct relative to the root

      - name: Upload Coverage HTML Report # Upload the coverage HTML report as an artifact.
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: html-reports/coverage_html # Path is now correct relative to the root

      - name: Upload JSON Report # Upload the JSON report as an artifact.
        uses: actions/upload-artifact@v4
        with:
          name: json-report
          path: html-reports/json_report.json

