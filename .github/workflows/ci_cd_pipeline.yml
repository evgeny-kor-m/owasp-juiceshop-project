# .github/workflows/ci_cd_pipeline.yml
name: testing_ci_cd_pipeline

on:

#  Trigger the workflow on 'push' to specified branches.
  push:
    branches:
      - master # The workflow will run when changes are pushed to the 'master' branch.
    # Trigger the workflow when a 'pull request' (PR) is created or updated
    # for the specified branches.
  pull_request:
    branches:
      - master # The workflow will run for PRs targeting the 'master' branch.
  # Trigger the workflow on a schedule (cron job).
  schedule:
    # '0 2 * * *' means "every day at 2:00 UTC".
    - cron: '0 2 * * *'

  # Add the ability to manually trigger the workflow from the GitHub interface.
  workflow_dispatch:

# --- Jobs ---
#  Jobs are sets of steps that execute on a single runner (virtual machine).
#  Jobs run in parallel by default, unless dependencies are specified (needs).
jobs:

#--- The 'test' job (Run tests) ---
  test:
    runs-on: ubuntu-latest # Run on an Ubuntu virtual machine.
    timeout-minutes: 20 # Increase the timeout for the entire job to 20 minutes.
    # ADDED: Explicitly provide read permission for the repository contents
    permissions:
      contents: write # Required for gh-pages (actions/checkout)

    steps:
      - name: Checkout repository # Step to clone the code from the repository.
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          echo "${{ secrets.DOCKER_ENV_VARS }}" > .env
        env:
          DOCKER_ENV_VARS: ${{ secrets.DOCKER_ENV_VARS }}

      - name: Build Docker Image
        run: make build  # Use Makefile

      - name: Run CI Tests
        run: make ci-test # Use Makefile

      - name: Install Allure CLI
        if: always()
        run: |
          curl -o allure-2.34.1.tgz -L https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -zxvf allure-2.34.1.tgz
          sudo mv allure-2.34.1 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          allure --version

      - name: Generate Static Allure Report
        if: always()
        run: allure generate --clean allure-results -o allure-reports

      - name: Upload Static Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-artifacts
          path: |
            allure-reports
            allure-results
            html-reports
            logs

