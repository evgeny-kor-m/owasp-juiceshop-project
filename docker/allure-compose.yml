# docker/allure-compose.yml

services:
  allure-server:
    image: ${ALLURE_IMAGE:-frankescobar/allure-docker-service}
    user: "${UID}:${GID}"
    container_name: allure-server-${ENVIRONMENT:-local}
    volumes:
      - ${ALLURE_RESULTS_PATH:-../allure-results}:/app/allure-results:rw
      - ${ALLURE_REPORT_PATH:-../allure-reports}:/app/allure-report:rw
    environment:
      CHECK_RESULTS_EVERY_SECONDS: ${ALLURE_CHECK_INTERVAL:-10}
      KEEP_HISTORY: ${ALLURE_KEEP_HISTORY:-1}
      KEEP_HISTORY_LATEST: ${ALLURE_HISTORY_LATEST:-25}
      ROOT_REDIRECT: "projects/default/reports/latest"
      URL_PREFIX: ""
      TZ: Europe/Moscow
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Browser -> Port 5050 on your computer -> Port 80 of the Nginx container ->
  # Nginx reads files from the mounted allure-report folder ->
  # Nginx serves the report files.
  web-server:
    image: nginx:alpine
    container_name: nginx-allure-${ENVIRONMENT:-local}
    # Пробрасываем порт 5050 на хосте в порт 80 внутри контейнера Nginx
    ports:
      - "${ALLURE_PORT:-5050}:80"
    volumes:
      # Монтируем локальный каталог с отчетами внутрь контейнера
      - ${ALLURE_REPORT_PATH:-./allure-report}:/usr/share/nginx/html/allure:ro
      - ${HTML_REPORT_PATH:-../reports}:/usr/share/nginx/html/reports
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
    restart: unless-stopped


networks:
  default:
    name: juiceshop-testing-network-${ENVIRONMENT:-local}