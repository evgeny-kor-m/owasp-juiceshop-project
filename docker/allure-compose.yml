# docker/allure-compose.yml

services:
  allure-server:
    image: ${ALLURE_IMAGE:-frankescobar/allure-docker-service}
    container_name: allure-server-${ENVIRONMENT:-local}
    ports:
      - "${ALLURE_PORT:-5050}:5050"
    volumes:
      - ${ALLURE_RESULTS_PATH:-../allure-results}:/app/allure-results:ro
      - ${ALLURE_REPORT_PATH:-../allure-report}:/app/reports
    environment:
      # Настройки Allure сервиса
      CHECK_RESULTS_EVERY_SECONDS: ${ALLURE_CHECK_INTERVAL:-10}
      KEEP_HISTORY: ${ALLURE_KEEP_HISTORY:-1}
      KEEP_HISTORY_LATEST: ${ALLURE_HISTORY_LATEST:-25}
      ROOT_REDIRECT: "projects/default/reports/latest"
      URL_PREFIX: ""
      # Дополнительные настройки
      TZ: Europe/Moscow
    restart: unless-stopped

    # Здоровье сервиса
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web-server:
    image: nginx:alpine
    container_name: nginx-allure-${ENVIRONMENT:-local}
    depends_on:
      - allure-server
    ports:
      - "5050:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default

networks:
  default:
    name: juiceshop-testing-network-${ENVIRONMENT:-local}