# docker/allure-compose.yml

services:
  allure-server:
    image: ${ALLURE_IMAGE}
    container_name: allure-server-${ENVIRONMENT}
    volumes:
      - ../${ALLURE_RESULTS_DIR}:/app/allure-results:rw
      - ../${ALLURE_REPORTS_DIR}:/app/allure-reports:rw
    environment:
      CHECK_RESULTS_EVERY_SECONDS: ${ALLURE_CHECK_INTERVAL}
      KEEP_HISTORY: ${ALLURE_KEEP_HISTORY}
      KEEP_HISTORY_LATEST: ${ALLURE_HISTORY_LATEST}
      ROOT_REDIRECT: "projects/default/reports/latest"
      URL_PREFIX: ${URL_PREFIX}
      TZ: Europe/Moscow
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Browser -> Port 5050 on your computer -> Port 80 of the Nginx container ->
  # Nginx reads files from the mounted allure-report folder ->
  # Nginx serves the report files.
  web-server:
    image: nginx:alpine
    container_name: nginx-allure-${ENVIRONMENT}
    # Пробрасываем порт 5050 на хосте в порт 80 внутри контейнера Nginx
    ports:
      - "${ALLURE_PORT}:80"
    volumes:
      # Монтируем локальный каталог с отчетами внутрь контейнера
      - ../${ALLURE_REPORTS_DIR}:/usr/share/nginx/html/allure:ro
      - ../${HTML_REPORTS_DIR}:/usr/share/nginx/html/reports:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped


networks:
  default:
    external: true
    name: juiceshop-testing-network-${ENVIRONMENT:-local}