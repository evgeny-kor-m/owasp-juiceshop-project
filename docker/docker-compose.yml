#  docker/docker-compose.yml

services:
  test-runner:
    build:
      context: ${PROJECT_ROOT_PATH:-.}
      dockerfile: ./docker/Dockerfile
    image: ${TEST_RUNNER_IMAGE:-test-runner:latest}
    container_name: test-runner-${ENVIRONMENT:-local}
    ports:
      - "${TEST_RUNNER_PORT:-4040}:4040"
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-1}'
          memory: ${MEMORY_LIMIT:-1G}
        reservations:
          cpus: '${CPU_RESERVATION:-0.5}'
          memory: ${MEMORY_RESERVATION:-1G}
    volumes:
      - ${PROJECT_ROOT_PATH:-..}:/app
      - ${ALLURE_RESULTS_PATH:-../allure-results}:/app/allure-results
      - ${ALLURE_REPORT_PATH:-../allure-reports}:/app/allure-reports
      - ${HTML_REPORT_PATH:-../html-reports}:/app/html-reports
      - ${LOGS_PATH:-../logs}:/app/logs
    extra_hosts:
      - "juice-shop.local:host-gateway" # Mapping Hostname on IP hosts
    environment:     # Set environment variables that the application inside the container needs.
      # Application variables needed for testing.
      - JUICESHOP_BASE_URL=${JUICESHOP_BASE_URL}
      - API_BASE_URL=${API_BASE_URL}
      - WEB_BASE_URL=${WEB_BASE_URL}
      # Python-specific environment variables.
      - PYTHONPATH=${PYTHONPATH:-/app}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-local}
    # The command to execute when the container starts. We use a bash command to run multiple commands sequentially.
#    command: /bin/bash -c "
#      # Run pytest with various report plugins.
#      pytest \
#      --json-report \
#      --json-report-file=/app/html-reports/json_report.json \
#      --cov=. \
#      --cov-report=html:/app/html-reports/coverage_html \
#      --cov-report=xml:/app/html-reports/coverage.xml \
#      --cov-report=term-missing \
#      --html=/app/html-reports/report.html \
#      --self-contained-html \
#      --alluredir=/app/allure-results \
#      && allure generate --clean /app/allure-results -o /app/allure-reports
#      "
    command: /bin/bash -c "pytest --html=/app/html-reports/report.html --self-contained-html --alluredir=/app/allure-results && allure generate --clean /app/allure-results -o /app/allure-reports"

    restart: no

    # Здоровье контейнера
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep pytest || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: juiceshop-testing-network-${ENVIRONMENT:-local}