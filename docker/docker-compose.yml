# docker/docker-compose.yml

services:
  test-runner:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    image: ${TEST_RUNNER_IMAGE}
    container_name: test-runner-${ENVIRONMENT}
    ports:
      - "${TEST_RUNNER_PORT:-4040}:4040"
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT}'
          memory: ${MEMORY_LIMIT}
        reservations:
          cpus: '${CPU_RESERVATION}'
          memory: ${MEMORY_RESERVATION}
    volumes:
      - ../:/app
      - ${ALLURE_RESULTS_PATH}:/app/allure-results
      - ${ALLURE_REPORT_PATH}:/app/allure-reports
      - ${HTML_REPORT_PATH}:/app/html-reports
      - ${LOGS_PATH}:/app/logs
      - ${SCREENSHOTS}:/app/screenshots
    extra_hosts:
      - "juice-shop.local:host-gateway" # Mapping Hostname on IP hosts
      - "host.docker.internal:host-gateway"
    environment:     # Set environment variables that the application inside the container needs.
      # Application variables needed for testing.
      - JUICESHOP_BASE_URL=${JUICESHOP_BASE_URL}
      - API_BASE_URL=${API_BASE_URL}
      - WEB_BASE_URL=${WEB_BASE_URL}
      # Python-specific environment variables.
      - PYTHONPATH=${PYTHONPATH}
      - LOG_LEVEL=${LOG_LEVEL}
      - ENVIRONMENT=${ENVIRONMENT}
    # The command to execute when the container starts. We use a bash command to run multiple commands sequentially.
#    command: /bin/bash -c "
#      # Run pytest with various report plugins.
#      pytest \
#      --json-report \
#      --json-report-file=/app/html-reports/json_report.json \
#      --cov=. \
#      --cov-report=html:/app/html-reports/coverage_html \
#      --cov-report=xml:/app/html-reports/coverage.xml \
#      --cov-report=term-missing \
#      --html=/app/html-reports/report.html \
#      --self-contained-html \
#      --alluredir=/app/allure-results \
#      && allure generate --clean /app/allure-results -o /app/allure-reports
#      "
    command: /bin/bash -c "pytest --html=/app/html-reports/report.html --self-contained-html --alluredir=/app/allure-results || true; allure generate --clean /app/allure-results -o /app/allure-reports"
    restart: no

    # Здоровье контейнера
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep pytest || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: juiceshop-testing-network-${ENVIRONMENT}