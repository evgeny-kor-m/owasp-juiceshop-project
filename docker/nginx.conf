server {
    listen 80; # Nginx listens on port 80

    location /allure/ {
        # The absolute path to the generated Allure HTML reports.
        # This corresponds to the volume mount in `docker-compose.yml`.
        alias /usr/share/nginx/html/allure/;

        # Enables directory listing so you can browse files in the browser.
        # This is useful for exploring the report contents.
        autoindex on;

        # Tries to serve a file (`$uri`), then a directory (`$uri/`).
        # If neither is found, it returns a 404 Not Found error.
        try_files $uri $uri/ =404;
    }
    location /reports/ {
        alias /usr/share/nginx/html/reports/;
        autoindex on;
        try_files $uri $uri/ =404;
    }
}