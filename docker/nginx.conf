server {
    listen 80; # Nginx listens on port 80
    server_name localhost;

    # Динамические Allure отчеты через proxy к allure-server
    location /allure-live/ {
        proxy_pass http://allure-server-local:5050/projects/default/reports/latest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    location /allure/ {
        # The absolute path to the generated Allure HTML reports.
        # This corresponds to the volume mount in `docker-compose.yml`.
        alias /usr/share/nginx/html/allure/;

        # Enables directory listing so you can browse files in the browser.
        # This is useful for exploring the report contents.
        autoindex on;

        # Tries to serve a file (`$uri`), then a directory (`$uri/`).
        # If neither is found, it returns a 404 Not Found error.
        try_files $uri $uri/ =404;
    }
    location /reports/ {
        alias /usr/share/nginx/html/reports/;
        index report.html;
        autoindex on;
        try_files $uri $uri/ =404;
    }
    # Главная страница - редирект на отчеты
    location = / {
        return 301 /reports/;
    }

    # Статические файлы
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}