server {
    listen 80; # Nginx слушает на порту 80
    server_name localhost;

    # Динамические Allure отчеты через proxy к allure-server
    # ЭТОТ БЛОК ЗАКОММЕНТИРОВАН/УДАЛЕН, чтобы избежать проксирования.
    # location /allure-live/ {
    #     proxy_pass http://allure-server-local:5050/projects/default/reports/latest/
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_redirect off;
    #     proxy_buffering off;
    # }

    # Блок для отдачи статических Allure отчетов
    location /allure/ {
        # Абсолютный путь к сгенерированным HTML-отчетам Allure.
        # Соответствует монтированию: ${ALLURE_REPORT_PATH}:/usr/share/nginx/html/allure
        alias /usr/share/nginx/html/allure/;

        # Включает листинг директорий для просмотра содержимого отчета
        autoindex on;

        # Пытается отдать файл, затем директорию. Если не находит, возвращает 404.
        try_files $uri $uri/ =404;
    }

    # Блок для отдачи общих HTML-отчетов
    location /reports/ {
        # Абсолютный путь к HTML-отчетам.
        # Соответствует монтированию: ${HTML_REPORT_PATH}:/usr/share/nginx/html/reports
        alias /usr/share/nginx/html/reports/;

        # Устанавливает index.html (или report.html) как файл по умолчанию при доступе к директории.
        index report.html;

        # Включает листинг директорий
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Блок по умолчанию: если ничего не найдено, отдаем 404.
    location / {
        return 404;
    }
}