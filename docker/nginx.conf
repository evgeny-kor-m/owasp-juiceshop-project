server {
    listen 80;

    location /allure/ {
        # Путь к сгенерированным HTML-отчетам Allure.
        alias /usr/share/nginx/html/allure/;
        # Включаем просмотр директорий, чтобы можно было видеть файлы в браузере.
        autoindex on;
        # Пытаемся найти файл или директорию, иначе возвращаем 404.
        try_files $uri $uri/ =404;
    }
}